<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FerFlix</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--red:#e50914;--bg:#141414;--fg:#fff;--muted:#b3b3b3}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:24px;padding:9px 4%;background:linear-gradient(#000c,#0000);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{color:var(--red);font-weight:900;font-size:25px;letter-spacing:1px;text-decoration:none}
nav a.l{color:#e5e5e5;text-decoration:none;font-size:14px;cursor:pointer}nav a.l.on{font-weight:700;color:#fff}
nav input{margin-left:auto;background:#000a;border:1px solid #fff6;color:#fff;padding:7px 12px;border-radius:3px;width:200px}
.hero{position:relative;height:50vh;min-height:330px;background:#222 center/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,#0000 60%),linear-gradient(0deg,var(--bg) 0,#0000 35%)}
.hero .in{position:absolute;z-index:2;left:4%;bottom:15%;max-width:620px}
.hero h1{font-size:clamp(28px,3.6vw,46px);margin-bottom:8px;text-shadow:2px 2px 8px #0008}
.hero p{font-size:clamp(14px,1.25vw,17px);line-height:1.4;text-shadow:1px 1px 4px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:12px;margin-top:12px}
.btn{padding:9px 24px;border-radius:4px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.btn.w{background:#fff;color:#000}.btn.w:hover{background:#ffffffbb}
.btn.g{background:#6d6d6eb3}.btn.g:hover{background:#6d6d6e66}
main{position:relative;z-index:3;margin-top:-5vh;padding-bottom:60px}
main.flat{margin-top:0;padding-top:70px}
.row{margin:0 0 28px;position:relative}
.row h2{font-size:20px;margin:0 4% 10px}
.track{display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;padding:30px 4%;margin:-30px 0;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:min(23vw,300px);aspect-ratio:16/9;border-radius:4px;background:#2a2a2a center/cover;position:relative;transition:transform .25s;cursor:pointer}
.card:hover{transform:scale(1.18);z-index:5;box-shadow:0 8px 24px #000a}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:14px;font-weight:700;background:linear-gradient(0deg,#000d,#0000);border-radius:0 0 4px 4px}
.card .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
/* cuadrícula de películas con pósters verticales (2:3) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px 12px;padding:6px 4% 10px}
.grid .card{width:auto;aspect-ratio:2/3;border-radius:6px}
.grid .card:hover{transform:scale(1.06)}
.grid .card .cap{border-radius:0 0 6px 6px}
.grid .card.hasposter .cap{opacity:0;transition:opacity .2s}   /* el póster ya lleva el título: se muestra al pasar el ratón */
.grid .card.hasposter:hover .cap{opacity:1}
/* quién ha visto la película entera: animalitos abajo a la izquierda del póster */
/* externas: idioma (arriba a la izquierda) y nota (arriba a la derecha) */
.card .lg{position:absolute;top:7px;left:7px;z-index:3;max-width:calc(100% - 62px);background:#000d;color:#fff;font-size:11.5px;font-weight:800;line-height:1.2;padding:4px 8px;border-radius:4px;border-left:3px solid #8a8a8a}
.card .lg.es{border-left-color:#e50914}.card .lg.en{border-left-color:#3b82f6}
.card .rt{position:absolute;top:7px;right:7px;z-index:3;background:#000d;color:#f5c542;font-size:11.5px;font-weight:800;padding:4px 7px;border-radius:4px}
.card .xb{position:absolute;top:7px;left:7px;z-index:3;display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:calc(100% - 58px)}
.card .xb span{background:#000d;color:#fff;font-size:11px;font-weight:800;line-height:1.2;padding:3px 7px;border-radius:4px;border-left:3px solid #8a8a8a}
.card .xb .es{border-left-color:#e50914}.card .xb .en{border-left-color:#3b82f6}.card .xb .sb{border-left-color:#f5c542;font-weight:700}.card .xb .no{color:#bbb;border-left-color:#555;font-weight:600}
.card .src{position:absolute;bottom:8px;right:7px;z-index:3;font-size:10.5px;font-weight:900;padding:3px 7px;border-radius:4px;background:#000d;color:#ccc;transition:opacity .2s}
.card .src.yt{background:#e00;color:#fff}.card .src.rtve{background:#e8521c;color:#fff}
.grid .card:hover .src{opacity:0}
.srcnote{background:#ffffff12;border:1px solid #ffffff30;border-radius:6px;padding:10px 14px;margin:8px 0 14px;font-size:14px;line-height:1.45}
.srcnote.yt{background:#e0000018;border-color:#e0000066}
.extlegend{color:var(--muted);font-size:13px;padding:0 4% 6px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.extlegend i{font-style:normal;font-size:10.5px;font-weight:900;padding:2px 6px;border-radius:4px;background:#000;color:#ccc;border:1px solid #333}
.extlegend i.yt{background:#e00;color:#fff;border:0}.extlegend i.rtve{background:#e8521c;color:#fff;border:0}
#ytp{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column}
#ytp.on{display:flex}
#ytp .ybar{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#111;font-size:15px}
#ytp .ybar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ytp .ybar small{color:var(--muted)}
#ytp button{background:#ffffff1a;color:#fff;border:0;border-radius:4px;padding:7px 12px;font-size:14px;cursor:pointer}
#ytp button:hover{background:#ffffff33}
#yFrame{flex:1;position:relative}#yFrame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.langline{margin:2px 0 10px;font-size:15px}.langline b{background:#fff;color:#000;padding:2px 9px;border-radius:4px;margin:0 6px}
.langline small{color:var(--muted)}
.card .rv{position:absolute;bottom:8px;right:7px;z-index:3;background:#e8521c;color:#fff;font-size:11px;font-weight:900;letter-spacing:.5px;padding:3px 7px;border-radius:4px}
.card .ex{position:absolute;bottom:8px;left:7px;z-index:3;background:#000d;color:#ddd;font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px}
.rtvenote{background:#e8521c22;border:1px solid #e8521c88;border-radius:6px;padding:10px 14px;margin:8px 0 14px;font-size:14px;line-height:1.45}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.extnote{color:var(--muted);font-size:13px;padding:0 4% 4px}
.wby{position:absolute;left:7px;bottom:9px;display:flex;z-index:2;transition:opacity .2s}
.wby span{width:24px;height:24px;border-radius:50%;background:#141414e6;border:1.5px solid #46d369;display:flex;align-items:center;justify-content:center;
  font-size:14px;margin-left:-7px;box-shadow:0 2px 6px #000a}
.wby span:first-child{margin-left:0}.wby .more{font-size:10px;font-weight:800;color:#46d369}
.wby span.part{border-color:#f5c542}   /* empezada (amarillo) frente a vista entera (verde) */
.grid .card:hover .wby{opacity:0}   /* al pasar el ratón deja sitio al título */
.grid .card:not(.hasposter) .wby{bottom:auto;top:8px}   /* sin póster el título va siempre abajo: los animalitos, arriba */
@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:12px 8px}}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.arrow{position:absolute;top:30px;bottom:30px;width:4%;z-index:6;background:#000a;font-size:30px;opacity:0;transition:opacity .2s}
.row:hover .arrow{opacity:1}.arrow.r{right:0}.arrow.lft{left:0}
.empty{text-align:center;padding:30vh 20px;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:#000b;display:none;overflow-y:auto}
.modal.on{display:block}
.box{background:#181818;width:min(860px,94vw);margin:4vh auto;border-radius:8px;overflow:hidden;position:relative}
.box .top{aspect-ratio:16/9;background:#222 center/cover;position:relative}
.box .top::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#181818 0,#0000 50%)}
.box .top .in{position:absolute;z-index:2;left:36px;bottom:30px}
.box .top h2{font-size:34px;margin-bottom:14px}
.x{position:absolute;top:14px;right:14px;z-index:3;width:36px;height:36px;border-radius:50%;background:#181818;font-size:20px}
.body{padding:0 36px 36px}
.meta{color:#46d369;font-weight:700;margin:8px 0}.meta span{color:var(--muted);font-weight:400;margin-left:10px}
.body p{line-height:1.5;color:#d2d2d2}
.eps h3{display:inline-block;margin:26px 0 12px}
.eps select{float:right;margin-top:24px;background:#242424;color:#fff;border:1px solid #fff4;padding:7px 10px;border-radius:4px}
.ep{display:flex;gap:16px;align-items:center;padding:16px;border-bottom:1px solid #333;cursor:pointer;border-radius:4px}
.ep:hover{background:#2a2a2a}.ep .n{font-size:22px;color:var(--muted);width:30px;text-align:center}
.ep .t{flex:1}.ep .t b{display:block;margin-bottom:4px}.ep .t small{color:var(--muted)}
.ep .p{height:3px;background:var(--red);margin-top:6px;border-radius:2px}
/* player */
#player{position:fixed;inset:0;z-index:100;background:#000;display:none;user-select:none}
#player.on{display:block}
#player video{width:100%;height:100%;background:#000}
#player video::cue{background:#000a;color:#fff;font-size:1.5em;font-family:Arial}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .3s;background:linear-gradient(#000a 0,#0000 18%,#0000 70%,#000c 100%)}
#player.idle .ui{opacity:0;cursor:none}
.ui .tp{display:flex;align-items:center;gap:18px;padding:22px 28px;font-size:20px}
.ui .tp .back{font-size:30px}
.ui .bt{padding:0 28px 22px}
.seek{width:100%;height:5px;background:#fff4;border-radius:3px;position:relative;cursor:pointer;margin-bottom:14px;transition:height .1s}
.seek:hover{height:8px}
.seek .buf,.seek .cur{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.seek .buf{background:#fff5}.seek .cur{background:var(--red)}
.seek .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--red);transform:translate(-50%,-50%)}
.ctl{display:flex;align-items:center;gap:20px}
.ctl button{font-size:26px;line-height:1;opacity:.9}.ctl button:hover{opacity:1;transform:scale(1.12)}
.ctl .sp{flex:1}.ctl .time{font-size:14px;color:#ddd;min-width:110px}
.vol{width:80px;accent-color:var(--red)}
.menu{position:absolute;right:28px;bottom:84px;background:#000e;border:1px solid #fff3;border-radius:6px;padding:8px 0;min-width:190px;display:none}
.menu.on{display:block}
.menu div{padding:9px 22px;cursor:pointer;font-size:15px}.menu div:hover{background:#fff2}.menu div.sel::before{content:"✓ ";color:var(--red)}
.menu div:not(.sel){padding-left:40px}
.menu div.h{padding:8px 22px 4px;font-size:12px;color:#999;text-transform:uppercase;cursor:default;letter-spacing:.5px}.menu div.h:hover{background:none}.menu div.h::before{content:""}
.spin{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border:4px solid #fff3;border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite;display:none}
@keyframes s{to{transform:rotate(360deg)}}
#gate{position:fixed;inset:0;z-index:200;background:radial-gradient(#2a0a0c,#000);display:none;align-items:center;justify-content:center;padding:20px}
#gate.on{display:flex}
#gate form{width:min(340px,100%);text-align:center}
#gate .logo{display:block;font-size:42px;margin-bottom:30px}
#gate input{width:100%;padding:14px;border-radius:4px;border:1px solid #555;background:#222;color:#fff;font-size:18px;text-align:center;letter-spacing:4px}
#gate button{width:100%;margin-top:14px;padding:13px;border-radius:4px;background:var(--red);font-weight:700;font-size:17px}
#gate button:disabled{opacity:.5}
#gate p{margin-top:16px;min-height:22px;color:#ff8080;font-size:14px}
/* perfiles */
#who{position:fixed;inset:0;z-index:190;background:radial-gradient(#2a0a0c,#000);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#who.on{display:flex}
#who .in{width:min(460px,100%);text-align:center}
#who h1{font-size:30px;margin:10px 0 6px}#who .sub{color:var(--muted);margin-bottom:22px}
#who .fld{position:relative}
#who input{width:100%;padding:14px;border-radius:4px;border:1px solid #555;background:#222;color:#fff;font-size:18px}
.sug{position:absolute;left:0;right:0;top:100%;background:#1c1c1c;border:1px solid #444;border-top:0;border-radius:0 0 6px 6px;text-align:left;z-index:2;display:none}
.sug.on{display:block}
.sug div{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:16px}
.sug div:hover,.sug div.act{background:#333}.sug span{font-size:26px}.sug small{margin-left:auto;color:var(--muted)}
.animals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0 4px}
.animals button{font-size:34px;padding:8px 0;border-radius:8px;background:#222;border:2px solid transparent;transition:transform .1s}
.animals button:hover{transform:scale(1.1)}.animals button.on{border-color:var(--red);background:#3a1215}
#who .go{width:100%;margin-top:18px;padding:13px;border-radius:4px;background:var(--red);font-weight:700;font-size:17px}
#who .go:disabled{opacity:.45;cursor:default}
#who .err{color:#ff8080;min-height:20px;margin-top:12px;font-size:14px}
.me{display:flex;align-items:center;gap:8px;cursor:pointer;position:relative;font-size:14px;white-space:nowrap}
.me .av{font-size:24px;width:34px;height:34px;border-radius:6px;background:#333;display:flex;align-items:center;justify-content:center}
.me .dd{position:absolute;right:0;top:44px;background:#000e;border:1px solid #fff3;border-radius:6px;padding:6px 0;display:none;min-width:170px}
.me .dd.on{display:block}.me .dd div{padding:9px 16px}.me .dd div:hover{background:#fff2}
.ep .done{color:#46d369;font-size:13px;margin-left:8px}
.ep .mk{width:34px;height:34px;border-radius:50%;border:2px solid #fff6;font-size:16px;flex:none}
.ep .mk.on{border-color:#46d369;color:#46d369}.ep .mk:hover{border-color:#fff}
.box .top .btns{margin-top:0}
/* tarjeta en proceso: gris que se va llenando de color de abajo arriba */
.card.proc{cursor:default;overflow:hidden}
.card.proc:hover{transform:none;box-shadow:none}
.card.proc .gray,.card.proc .fill{position:absolute;inset:0;background:inherit;border-radius:4px}
.card.proc .gray{filter:grayscale(1) brightness(.3)}
.card.proc .fill{clip-path:inset(calc(100% - var(--p)) 0 0 0);transition:clip-path 1.5s ease;filter:brightness(.8)}
.card.proc .line{position:absolute;left:0;right:0;height:2px;bottom:var(--p);background:var(--red);box-shadow:0 0 12px 2px var(--red);transition:bottom 1.5s ease}
.card.proc .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px 18px;text-shadow:0 1px 6px #000}
.card.proc .ov b{font-size:28px}.card.proc .ov small{font-size:12px;color:#e5e5e5;margin-top:2px}
.card.proc.nothumb{background:#1c1c1c}.card.proc.nothumb .gray{background:#1c1c1c;filter:none}
.card.proc.nothumb .fill{background:linear-gradient(0deg,#e50914,#5a070b)}
.card.proc.ready .fill{filter:none}.card.proc.ready .line{opacity:0;transition:opacity .6s 1.2s}
.card.proc.ready .ov b{color:#46d369}
/* cuadro de actividad de todos */
#app{position:relative}
/* Encima de la portada, a la derecha, y siempre por encima de donde empiezan las filas:
   las filas arrancan en (alto de la portada − 8vh), así que el cuadro termina 28px antes */
.feed{width:360px;display:flex;flex-direction:column;max-height:calc(100vh - 80px);
  background:linear-gradient(160deg,#1c1c1ce6,#0d0d0de6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid #ffffff1a;border-radius:14px;box-shadow:0 18px 40px #0009;overflow:hidden}
.feed .hd{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid #ffffff12;flex:none}
.feed .hd>span{font-size:22px;width:38px;height:38px;border-radius:10px;background:#e509141f;display:flex;align-items:center;justify-content:center}
.feed h3{font-size:15px;letter-spacing:.2px}.feed .hd small{color:var(--muted);font-size:12px}
.feed .list{overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:#444 transparent}
.feed .it{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;transition:background .15s}
.feed .it:hover{background:#ffffff12}
.feed .th{position:relative;flex:none;width:84px;aspect-ratio:16/9;border-radius:6px;background:#2a2a2a center/cover}
.feed .th .an{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;border-radius:50%;background:#181818;border:2px solid #181818;
  display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 6px #0008}
.feed .tx{min-width:0;flex:1;padding-left:4px}
.feed .who{display:flex;align-items:baseline;gap:8px;font-size:13px}
.feed .who time{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.feed .what{font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .person{border-radius:10px;margin-bottom:4px}
.feed .person.open{background:#ffffff08}
.feed .ph{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;user-select:none;transition:background .15s}
.feed .ph:hover{background:#ffffff12}
.feed .pav{flex:none;width:40px;height:40px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:24px}
.feed .pinfo{flex:1;min-width:0}.feed .pinfo b{font-size:14px}
.feed .pinfo small{display:block;color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .ph time{color:var(--muted);font-size:11px;white-space:nowrap}
.feed .chev{font-size:20px;color:#888;transition:transform .2s;line-height:1}
.feed .person.open .chev{transform:rotate(90deg);color:#fff}
.feed .pitems{padding:0 4px 6px 14px;border-left:2px solid #ffffff14;margin-left:28px}
.feed .pitems .it{padding:6px 6px}
.feed .pitems .th{width:72px}
.feed .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
.feed .tag.ok{background:#46d36922;color:#46d369}
.feed .tag.part{background:#f5c54222;color:#f5c542}
.feed .th .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--red);border-radius:0 0 0 6px}
.feed .fep{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .none{color:var(--muted);font-size:13px;padding:14px 10px 16px;text-align:center;line-height:1.5}
/* botón 👀 de la barra y su desplegable */
.fdrop{position:relative}
.fbtn{position:relative;width:38px;height:38px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.fbtn:hover,.fdrop.open .fbtn{background:#ffffff1f}
.livenow{display:none;align-items:center;gap:8px;cursor:pointer;padding:3px 10px 3px 4px;border-radius:20px;background:#ffffff12;transition:background .15s}
.livenow.on{display:flex}.livenow:hover{background:#ffffff24}
.livenow .avs{display:flex}
.livenow .lv{width:30px;height:30px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:18px;
  border:2px solid #46d369;margin-left:-8px;animation:ping 1.8s infinite}
.livenow .lv:first-child{margin-left:0}
.livenow .more{font-size:12px;color:#ddd;margin-left:4px}
.livenow small{font-size:12px;color:#46d369;font-weight:700;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.livenow small{display:none}}
.fpanel{position:absolute;right:-60px;top:44px;display:none;z-index:60}
.fdrop.open .fpanel{display:block;animation:fadeup .2s ease}
@media(max-width:700px){.fpanel{position:fixed;left:8px;right:8px;top:56px}.fpanel .feed{width:auto}}
/* ===== saltar intro / siguiente episodio / saltar créditos ===== */

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CAT=[], FILTER='all', QUERY='';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let ME=null, PROG={};   // perfil activo y su progreso {video_id:{t,done,ts}} (guardado en el servidor)
const prog=()=>PROG;
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const bg=t=>t.thumb?`background-image:url('${esc(t.thumb)}')`:'';

async function load(){
  const r=await fetch('api/catalog.php');
  if(r.status===401){showGate();return}
  CAT=await r.json();
  $('#gate').classList.remove('on');
  const id=store.get('mf_profile',null);
  if(id){const p=await fetch('api/profiles.php?id='+id);if(p.ok){await setProfile(await p.json());return}}
  showWho();
}
/* ---------- perfiles ---------- */
async function setProfile(p){
  playIntro();   // la animación de FERFLIX, una vez al día por navegador
  ME=p; store.set('mf_profile',p.id);
  $('#who').classList.remove('on'); document.body.style.overflow='';
  $('#me').style.display='flex'; $('#fdrop').style.display=''; $('#meAv').textContent=p.animal; $('#meName').textContent=p.name;
  PROG=await (await fetch('api/progress.php?profile='+p.id)).json();
  loadFeed(); pollProc(); setTimeout(tryAdopt,500);
  // pasa al perfil el progreso antiguo que había guardado en este navegador
  const old=store.get('mf_prog',null);
  if(old&&Object.keys(old).length){
    const items=Object.entries(old).filter(([id])=>!PROG[id]).map(([id,x])=>({video_id:+id,t:Math.round(x.t),ts:Math.round(x.ts/1000)}));
    if(items.length){await fetch('api/progress.php',{method:'POST',body:JSON.stringify({profile:p.id,items})});PROG=await (await fetch('api/progress.php?profile='+p.id)).json()}
    try{localStorage.removeItem('mf_prog')}catch{}
  }
  render();
}
let WA=null, WSEL=null, ANIMALS=[], sugT;
async function showWho(){
  $('#who').classList.add('on'); document.body.style.overflow='hidden'; $('#me').style.display='none'; $('#fdrop').style.display='none'; $('#liveNow').classList.remove('on');
  $('#wname').value=''; WSEL=null; WA=null; $('#werr').textContent=''; $('#wsug').classList.remove('on');
  if(!ANIMALS.length)ANIMALS=(await (await fetch('api/profiles.php')).json()).animals;
  $('#wanimals').innerHTML=ANIMALS.map(a=>`<button type="button" data-an="${a}">${a}</button>`).join('');
  whoState(); $('#wname').focus();
}
function whoState(){
  $('#wnew').style.display=WSEL?'none':'';
  $('#wanimals').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.an===WA));
  $('#wgo').disabled=!(WSEL||($('#wname').value.trim().length>=2&&WA));
  $('#wgo').textContent=WSEL?`Seguir como ${WSEL.animal} ${WSEL.name}`:'Crear perfil y entrar';
}
$('#wanimals').onclick=e=>{const b=e.target.closest('[data-an]');if(b){WA=b.dataset.an;whoState()}};
$('#wname').oninput=()=>{
  WSEL=null; $('#werr').textContent=''; whoState(); clearTimeout(sugT);
  const q=$('#wname').value.trim(); if(!q){$('#wsug').classList.remove('on');return}
  sugT=setTimeout(async()=>{
    const j=await (await fetch('api/profiles.php?q='+encodeURIComponent(q))).json();
    if($('#wname').value.trim()!==q)return;
    $('#wsug')._list=j.profiles;
    $('#wsug').innerHTML=j.profiles.map(p=>`<div data-pid="${p.id}"><span>${p.animal}</span>${esc(p.name)}<small>elegir</small></div>`).join('');
    $('#wsug').classList.toggle('on',j.profiles.length>0);
    const ex=j.profiles.find(p=>p.name.toLowerCase()===q.toLowerCase()); if(ex){WSEL=ex;whoState()}
  },200);
};
$('#wsug').onclick=e=>{const d=e.target.closest('[data-pid]');if(!d)return;
  WSEL=$('#wsug')._list.find(p=>p.id==d.dataset.pid);$('#wname').value=WSEL.name;$('#wsug').classList.remove('on');whoState()};
$('#wname').onkeydown=e=>{if(e.key==='Enter'&&!$('#wgo').disabled)$('#wgo').click()};
$('#wgo').onclick=async()=>{
  if(WSEL){await avatarPop(WSEL);return setProfile(WSEL)}
  const r=await fetch('api/profiles.php',{method:'POST',body:JSON.stringify({name:$('#wname').value,animal:WA})}),j=await r.json();
  if(!r.ok){$('#werr').textContent=j.error;return}
  await avatarPop(j); setProfile(j);
};
// el animal del perfil aparece en grande con un saludo
function avatarPop(p){
  $('#popAv').textContent=p.animal; $('#popHi').textContent=`¡Hola, ${p.name}!`;
  const el=$('#pop'); el.classList.remove('out'); el.classList.add('on');
  return new Promise(r=>setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.classList.remove('on','out');r()},400)},1100));
}
/* ---------- intro de FERFLIX ---------- */
function playIntro(){
  const today=new Date().toDateString(); if(store.get('mf_intro_day','')===today)return; store.set('mf_intro_day',today);
  const el=$('#intro'); $('#iw').innerHTML=[...'FERFLIX'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
  el.classList.remove('out'); el.classList.add('on'); tudum();
  const end=()=>{if(!el.classList.contains('on'))return;el.classList.add('out');setTimeout(()=>el.classList.remove('on','out'),450)};
  el.onclick=end; setTimeout(end,3000);
}
// el "tu-dum": dos golpes graves con reverberación y un acorde suave (sintetizado, sin archivos de audio).
// Si el navegador no deja sonar audio sin un clic previo, la animación sale igual pero en silencio.
function tudum(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume();
    const out=ac.createGain(); out.gain.value=.6; out.connect(ac.destination);
    const rev=ac.createConvolver(), n=ac.sampleRate*2.4, ir=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
    rev.buffer=ir; const wet=ac.createGain(); wet.gain.value=.4; rev.connect(wet); wet.connect(out);
    const hit=(t0,f,dur,vol)=>{
      const o=ac.createOscillator(),g=ac.createGain(); o.type='sine';
      o.frequency.setValueAtTime(f*2.4,t0); o.frequency.exponentialRampToValueAtTime(f,t0+.07);
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
      o.connect(g); g.connect(out); g.connect(rev); o.start(t0); o.stop(t0+dur+.05);
      const nb=ac.createBuffer(1,ac.sampleRate*.09,ac.sampleRate), nd=nb.getChannelData(0);
      for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
      const ns=ac.createBufferSource(),lp=ac.createBiquadFilter(),ng=ac.createGain();

const TINT=new Map();
function tintOf(url){
  if(!url)return Promise.resolve(null); if(TINT.has(url))return TINT.get(url);
  const pr=new Promise(res=>{const im=new Image(); im.onerror=()=>res(null);
    im.onload=()=>{try{
      const c=document.createElement('canvas'); c.width=c.height=28; const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(im,0,0,28,28); const d=x.getImageData(0,0,28,28).data;
      // agrupa los píxeles por tono (12 grupos) dando más peso a los colores vivos; gana el grupo más fuerte
      const bins=Array.from({length:12},()=>({w:0,r:0,g:0,b:0}));
      for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn;
        if(mx<40||df/mx<.22)continue;
        const h=mx===r?((g-b)/df+6)%6:mx===g?(b-r)/df+2:(r-g)/df+4, B=bins[Math.floor(h*2)%12], w=(df/mx)**2*(mx/255);
        B.w+=w;B.r+=r*w;B.g+=g*w;B.b+=b*w}
      const top=bins.reduce((a,b)=>b.w>a.w?b:a); if(top.w<.8)return res(null);
      const rgb=[top.r/top.w,top.g/top.w,top.b/top.w], k=Math.min(1.6,210/Math.max(...rgb));
      res(rgb.map(v=>Math.round(Math.min(255,v*k))).join(','));
    }catch{res(null)}};
    im.src=url});
  TINT.set(url,pr); return pr;
}

  return `<div class="row"><h2>${esc(name)}</h2><button class="arrow lft">‹</button><div class="track">${items.join('')}</div><button class="arrow r">›</button></div>`;
}
function render(){
  const q=QUERY.toLowerCase();
  // las externas solo salen en su pestaña (y en la búsqueda, «Continuar viendo» y «Ya visto»)
  const XT={ext:'movie',extS:'series'}[FILTER];
  let list=CAT.filter(t=>(XT?t.external&&t.type===XT:FILTER==='all'||(t.type===FILTER&&!t.external))&&(!q||t.title.toLowerCase().includes(q)));
  if(!CAT.length&&!PROC.length){$('#app').innerHTML='<div class="empty"><h2>Todavía no hay contenido</h2><p>Sube películas o series desde el panel de administración.</p></div>';return}
  const [cont,seen]=activity(list), who=ME?`${ME.animal} ${ME.name}`:'';
  const procOf=(type,portrait)=>PROC.filter(p=>p.type===type&&(!q||p.title.toLowerCase().includes(q))).map(p=>procCard(p,portrait));
  // Pestañas Películas y Series: sin portada grande, la cuadrícula de pósters directamente arriba
  if(XT&&!q){
    // todas las fuentes mezcladas: agrupadas por si se entienden en español y, dentro, por nota
    loadRtve();
    const norm=x=>x.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
    const have=new Set(CAT.filter(t=>t.type===XT).map(t=>norm(t.title)));   // si ya está aquí dentro, no repetir la de RTVE
    const items=[...list.map(t=>({k:xRank(t.lang,t.subs),r:+t.rating||0,n:t.title,h:posterCard(t)})),
      ...(RTVE||[]).filter(r=>(r.kind||'movie')===XT&&!have.has(norm(r.title))).map(r=>({k:xRank(r.lang,r.subs),r:+r.rating||0,n:r.title,h:rtveCard(r)}))];
    items.sort((a,b)=>a.k-b.k||b.r-a.r||a.n.localeCompare(b.n));
    const h=[0,1,2].map(k=>gridHtml(X_GROUPS[k],items.filter(i=>i.k===k).map(i=>i.h))).join('');
    const legend=`<div class="extlegend"><span><i>🌐 Archive</i> <i class="yt">▶ YouTube</i> se ven aquí dentro</span><span>${XT==='movie'&&RTVE_HERE?'<i class="rtve">▶ RTVE</i> se ve aquí con el reproductor de RTVE · ':''}<i class="rtve">↗ RTVE Play</i> enlace externo: se abre su web (gratis, con cuenta de RTVE)</span></div>`;
    $('#app').innerHTML='<main class="flat">'+(h?legend+h:`<div class="empty" style="padding:20vh 20px"><h2>Todavía no hay ${XT==='movie'?'películas':'series'} externas</h2></div>`)+'</main>';
    applyTints(); paintWatchers(); return;
  }
  if((FILTER==='movie'||FILTER==='series')&&!q){
    const name=FILTER==='movie'?'Películas':'Series';
    $('#app').innerHTML='<main class="flat">'+(gridHtml(name,[...procOf(FILTER,true),...list.map(posterCard)])
      ||`<div class="empty" style="padding:20vh 20px"><h2>Todavía no hay ${name.toLowerCase()}</h2></div>`)+'</main>';
    applyTints(); paintWatchers(); return;
  }
  const hero=list.find(t=>!t.locked&&!t.external)||list[0]||CAT[0];
  let h=(hero?`<div class="hero" data-hero="${hero.id}" style="${bg(hero)}"><div class="in"><h1>${esc(hero.title)}</h1><p>${esc(hero.description)}</p>
   <div class="btns"><button class="btn w" data-play="${hero.id}">▶ Reproducir</button><button class="btn g" data-t="${hero.id}">ⓘ Más información</button></div></div></div>`
   :'<div class="hero" style="height:42vh;min-height:300px"></div>')+'<main>';
  if(q) h+=rowHtml('Resultados',list.map(t=>card(t)));
  else{
    h+=rowHtml(`Continuar viendo · ${who}`,cont.map(x=>card(x.t,x.v)));
    h+=rowHtml(`Ya visto por ${who}`,seen.map(x=>card(x.t,x.v)));
    // Películas en cuadrícula, por orden de subida (la última subida primero; CAT ya viene así del servidor)
    if(FILTER!=='series')h+=gridHtml('Películas',[...procOf('movie',true),...list.filter(t=>t.type==='movie'&&!t.external).map(posterCard)]);
    if(FILTER!=='movie')h+=rowHtml('Series',[...procOf('series'),...list.filter(t=>t.type==='series'&&!t.external).map(t=>card(t))]);
  }
  $('#app').innerHTML=h+'</main>';
  if(q&&!list.length)$('#app').innerHTML='<div class="empty" style="padding-top:30vh"><h2>Sin resultados</h2></div>';
  applyTints(); paintWatchers();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('.arrow'); if(a){const tr=a.parentElement.querySelector('.track');tr.scrollBy({left:(a.classList.contains('r')?1:-1)*tr.clientWidth*.85});return}
  const rv=e.target.closest('[data-rtve]'); if(rv){openRtve(RTVE.find(r=>r.id==rv.dataset.rtve));return}
  const pl=e.target.closest('[data-play]'); if(pl){const t=CAT.find(x=>x.id==pl.dataset.play);playTitle(t);return}
  const c=e.target.closest('[data-t]'); if(c){
    const t=CAT.find(x=>x.id==c.dataset.t);
    if(c.dataset.v){startVideo(t,t.videos.find(x=>x.id==c.dataset.v));} else openModal(t);
  }
});

/* ---------- modal ---------- */
function lastVideo(t){
  let best=null;for(const v of t.videos){const p=PROG[v.id];if(p&&(!best||p.ts>best.p.ts))best={v,p}}
  if(!best)return t.videos[0];
  if(best.p.done)return t.videos[t.videos.indexOf(best.v)+1]||t.videos[0];
  return best.v;
}
function playTitle(t){startVideo(t,lastVideo(t))}
function openModal(t){
  const seasons=[...new Set(t.videos.map(v=>v.season??1))].sort((a,b)=>a-b);
  let h=`<div class="top" style="${bg(t)}"><button class="x" id="mx">✕</button><div class="in"><h2>${esc(t.title)}</h2><div class="btns">${t.locked?`<div class="lockmsg">🔒 ${esc(t.locked)}</div>`:`<button class="btn w" data-play="${t.id}">▶ Reproducir</button>`}
    ${t.type==='movie'&&!t.locked?`<button class="btn g" id="markMovie"></button>`:''}</div></div></div>
  <div class="body"><div class="meta">${t.type==='series'?'Serie':'Película'}<span>${t.year??''}</span>${t.external&&t.rating?`<span>★ ${t.rating.toFixed(1)}</span>`:''}</div>
  ${t.external?langLine(t.lang,t.subs)+srcNote(t.source||'archive'):''}<p>${esc(t.description)}</p>`;
  if(t.type==='series') h+=`<div class="eps"><h3>Episodios</h3><select id="ssel">${seasons.map(s=>`<option value="${s}">Temporada ${s}</option>`).join('')}</select><div id="eplist"></div></div>`;
  $('#box').innerHTML=h+'</div>'; $('#modal').classList.add('on'); document.body.style.overflow='hidden';
  $('#box').style.removeProperty('--tint'); tintOf(t.poster||t.thumb).then(c=>{if(c)$('#box').style.setProperty('--tint',c)});
  $('#mx').onclick=closeModal;
  if(t.type==='movie'&&!t.locked){
    const v=t.videos[0], b=$('#markMovie');
    const upd=()=>{const d=!!(PROG[v.id]&&PROG[v.id].done);b.textContent=d?'✓ Vista':'＋ Marcar como vista';b.title=d?'Pulsa para desmarcar':''};
    upd(); b.onclick=async()=>{b.disabled=true;await markVideo(v,!(PROG[v.id]&&PROG[v.id].done));b.disabled=false;upd()};
  }
  if(t.type==='series'){
    const draw=()=>{const s=+$('#ssel').value;
      $('#eplist').innerHTML=t.videos.filter(v=>(v.season??1)===s).map(v=>`<div class="ep" data-ep="${v.id}"><div class="n">${v.episode??'·'}</div><div class="t"><b>${esc(v.name)}${PROG[v.id]&&PROG[v.id].done?'<span class="done">✓ Visto</span>':''}</b><small>${v.duration?Math.round(v.duration/60)+' min':''}</small>${pct(v)?`<div class="p" style="width:${pct(v)}%"></div>`:''}</div>
        <button class="mk ${PROG[v.id]&&PROG[v.id].done?'on':''}" data-mk="${v.id}" title="${PROG[v.id]&&PROG[v.id].done?'Desmarcar':'Marcar como visto'}">✓</button></div>`).join('');
      $('#eplist').querySelectorAll('.ep').forEach(el=>el.onclick=e=>{
        const v=t.videos.find(x=>x.id==el.dataset.ep);
        if(e.target.closest('.mk')){e.stopPropagation();markVideo(v,!(PROG[v.id]&&PROG[v.id].done)).then(draw);return}
        startVideo(t,v)});};
    $('#ssel').onchange=draw;
    const lv=lastVideo(t); $('#ssel').value=lv.season??1; draw();
  }
}

/* ---------- Chromecast ---------- */
// Mientras se envía a la tele, el vídeo local queda en pausa y los controles manejan el Chromecast.
let CAST=null;                     // {ctx, player, ctl, loaded, lastT}
let castStart=0;                   // desde dónde empezar en la tele (progreso guardado)
const casting=()=>!!(CAST&&CAST.loaded&&CAST.player.isConnected);
const curT=()=>casting()?CAST.player.currentTime:V.currentTime;
const curD=()=>casting()?(CAST.player.duration||V.duration||(cur&&cur.v.duration)||0):V.duration;
const isPaused=()=>casting()?CAST.player.isPaused:V.paused;
function seekTo(x){
  x=Math.max(0,Math.min((curD()||1)-1,x));
  if(casting()){CAST.player.currentTime=x;CAST.ctl.seek()}else V.currentTime=x;
}
const seekBy=d=>seekTo(curT()+d);
window.__onGCastApiAvailable=ok=>{
  CAST_SDK=ok;
  if(!ok){showCastBtns();return}   // Chrome/Edge sin envío activado: el botón explica qué pasa
  const ctx=cast.framework.CastContext.getInstance();
  ctx.setOptions({receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
  const player=new cast.framework.RemotePlayer(), ctl=new cast.framework.RemotePlayerController(player), E=cast.framework.RemotePlayerEventType;
  CAST={ctx,player,ctl,loaded:false,lastT:0};
  showCastBtns();
  ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED,e=>{
    const st=e.castState, C=cast.framework.CastState;
    document.querySelectorAll('.castb').forEach(b=>{b.classList.toggle('on',st===C.CONNECTED);
      b.title=st===C.CONNECTED?'Conectado a la tele · pulsa para desconectar':st===C.NO_DEVICES_AVAILABLE?'No se encuentra ningún Chromecast en tu Wi-Fi':'Enviar a la tele (Chromecast)'})});
  ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,e=>{
    const S=cast.framework.SessionState;
    if(e.sessionState===S.SESSION_STARTED||e.sessionState===S.SESSION_RESUMED){ if(cur)castLoad(); else toast2('📺 Conectado a la tele. Elige qué ver.') }
    else if(e.sessionState===S.SESSION_ENDED){
      const was=CAST.loaded, t=CAST.lastT;
      if(cur&&was&&MINI){saveProg(true,t);CAST.loaded=false;MINI=false;hideMini();cur=null;render();return}   // estaba minimizado: se cierra
      CAST.loaded=false; $('#castov').classList.remove('on');
      if(cur&&was){V.currentTime=t||V.currentTime;V.play().catch(()=>{})}   // sigue en este dispositivo donde iba
    }
  });
  ctl.addEventListener(E.CURRENT_TIME_CHANGED,()=>{if(casting()){CAST.lastT=player.currentTime;updateUI();updateMini()}});
  // al abrir/recargar FerFlix con la tele ya reproduciendo algo nuestro: recuperar los controles
  ctl.addEventListener(E.IS_MEDIA_LOADED_CHANGED,tryAdopt); ctl.addEventListener(E.MEDIA_INFO_CHANGED,tryAdopt);
  ctl.addEventListener(E.IS_PAUSED_CHANGED,()=>{if(!casting())return;
    P_.classList.toggle('paused',player.isPaused);$('#pp').textContent=$('#mPP').textContent=player.isPaused?'▶':'⏸';if(player.isPaused)saveProg(true)});
  ctl.addEventListener(E.VOLUME_LEVEL_CHANGED,()=>{if(casting())$('#vol').value=player.volumeLevel});
  ctl.addEventListener(E.PLAYER_STATE_CHANGED,()=>{
    // la tele terminó el vídeo: lo mismo que al acabar en local (siguiente capítulo o cerrar)
    if(casting()&&player.playerState===chrome.cast.media.PlayerState.IDLE&&CAST.lastT>curD()-8){CAST.loaded=false;onEnded()}
  });
};
// carga en la tele el vídeo que se está reproduciendo (con enlaces firmados: la tele no tiene la cookie de acceso)
async function castLoad(){
  const s=CAST&&CAST.ctx.getCurrentSession(); if(!s||!cur)return;
  CAST.loaded=false; const v=cur.v, from=V.currentTime>1?V.currentTime:castStart;
  let j; try{j=await (await fetch('api/cast.php?video='+v.id)).json()}catch{return toast2('No se pudo preparar el vídeo para la tele')}
  if(!cur||cur.v!==v)return;
  const mi=new chrome.cast.media.MediaInfo(j.video,'video/mp4'); mi.streamType=chrome.cast.media.StreamType.BUFFERED;
  const md=new chrome.cast.media.GenericMediaMetadata(); md.title=j.title; md.subtitle=j.subtitle; if(j.image)md.images=[new chrome.cast.Image(j.image)]; mi.metadata=md;
  mi.tracks=j.subs.map((x,i)=>{const t=new chrome.cast.media.Track(i+1,chrome.cast.media.TrackType.TEXT);
    t.trackContentId=x.url;t.trackContentType='text/vtt';t.subtype=chrome.cast.media.TextTrackType.SUBTITLES;t.name=x.label;t.language=x.lang;return t});
  const st=new chrome.cast.media.TextTrackStyle(); st.backgroundColor='#00000099'; st.fontScale=1.1; mi.textTrackStyle=st;
  const rq=new chrome.cast.media.LoadRequest(mi); rq.currentTime=from; rq.autoplay=true; rq.activeTrackIds=subIdx>=0?[subIdx+1]:[];
  try{await s.loadMedia(rq)}catch(e){return toast2('La tele no pudo abrir el vídeo'+(typeof e==='string'?' ('+e+')':''))}
  V.pause(); CAST.loaded=true; CAST.lastT=from;
  $('#castDev').textContent=s.getCastDevice().friendlyName||'la tele';
  $('#castov').style.backgroundImage=cur.t.thumb?`url('${cur.t.thumb}')`:''; $('#castov').classList.add('on');
  P_.classList.remove('paused'); $('#pp').textContent='⏸'; buildMenu();
  if(MINI)showMini();
}

  closeModal(); ytCur={t,v};
  $('#yTitle').textContent=t.title+(t.type==='series'?` — T${v.season??1}:E${v.episode??'?'} ${v.name}`:'');
  $('#yInfo').textContent='🗣 '+(t.lang||'?')+(t.subs?' · 💬 '+t.subs:'')+' · YouTube';
  $('#yNext').style.display=ytNextEp()?'':'none';
  $('#ytp').classList.add('on'); document.body.style.overflow='hidden';
  const sv=prog()[v.id], start=sv&&sv.t>15&&(!v.duration||sv.t<v.duration-30)?Math.floor(sv.t):0;
  try{await loadYTApi()}catch{}
  if(!window.YT||!YT.Player){toast2('No se pudo cargar YouTube. Si usas un bloqueador, desactívalo para esta web.');return}
  if(ytPlayer){try{ytPlayer.destroy()}catch{}}
  $('#yFrame').innerHTML='<div id="yIn"></div>';
  ytPlayer=new YT.Player('yIn',{videoId:ytId(v.file),host:'https://www.youtube-nocookie.com',
    playerVars:{autoplay:1,start,rel:0,playsinline:1,hl:'es',cc_lang_pref:'es',iv_load_policy:3},
    events:{onStateChange:e=>{
      if(e.data===YT.PlayerState.PAUSED)ytSave(true);
      if(e.data===YT.PlayerState.ENDED){ytSave(true,true);const nx=ytNextEp();if(nx)startYT(t,nx);else closeYT()}
    },onError:()=>toast2('YouTube no deja reproducir este vídeo ahora mismo.')}});
  clearInterval(ytTimer); ytTimer=setInterval(()=>ytSave(false),10000);
}
// guarda por dónde vas igual que el reproductor normal (vista = pasado el 80 %)
function ytSave(force,ended){
  if(!ytCur||!ME||!ytPlayer||!ytPlayer.getCurrentTime)return;
  const n=Date.now(); if(!force&&n-ytLast<10000)return; ytLast=n;
  const d=ytPlayer.getDuration()||ytCur.v.duration, t=ended?d:ytPlayer.getCurrentTime();
  if(!d||t<1)return;
  const v=ytCur.v, done=t>=d*0.8, old=PROG[v.id], item={video_id:v.id,t:Math.round(t),done,ts:Math.round(n/1000)};
  PROG[v.id]={t:item.t,done:done||!!(old&&old.done),ts:item.ts};
  const body=JSON.stringify({profile:ME.id,...item});
  if(document.visibilityState==='hidden'&&navigator.sendBeacon)navigator.sendBeacon('api/progress.php',body);
  else fetch('api/progress.php',{method:'POST',body,keepalive:true}).catch(()=>{});
}
function closeYT(){
  ytSave(true); clearInterval(ytTimer);
  if(ytPlayer){try{ytPlayer.destroy()}catch{}} ytPlayer=null; ytCur=null; $('#yFrame').innerHTML='';
  $('#ytp').classList.remove('on'); document.body.style.overflow=''; render();
}
$('#yX').onclick=closeYT;
$('#yNext').onclick=()=>{const nx=ytNextEp();if(nx){ytSave(true);startYT(ytCur.t,nx)}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ytp').classList.contains('on'))closeYT()});
addEventListener('pagehide',()=>ytSave(true));
function startVideo(t,v,opts={}){
  if(t.locked&&!opts.adopt){openModal(t);return}
  if(ytId(v.file)){startYT(t,v);return}
  hideUpNext(); upDismissed=false; $('#skipIntro').classList.remove('on'); $('#skipCred').classList.remove('on');
  cur={t,v}; closeModal();
  if(!MINI&&!opts.adopt){P_.classList.add('on'); document.body.style.overflow='hidden';}   // minimizado: el siguiente capítulo sigue en la barra
  audIdx=0; A.pause(); A.removeAttribute('src'); applyVol();
  V.innerHTML=''; V.src=AIRPLAY&&v.signed?v.signed:v.file;
  v.subs.forEach((s,i)=>{const tr=document.createElement('track');tr.kind='subtitles';tr.label=s.label;tr.srclang=s.lang;tr.src=s.file;V.appendChild(tr)});
  $('#ptitle').textContent=t.title+(t.type==='series'?` — T${v.season??1}:E${v.episode??'?'} ${v.name}`:'')+(t.external&&t.lang?` · 🗣 ${t.lang}`:'');
  const idx=t.videos.indexOf(v); $('#next').style.display=t.type==='series'&&idx<t.videos.length-1?'':'none';
  const saved=prog()[v.id];
  castStart=saved&&saved.t>15&&(!v.duration||saved.t<v.duration-30)?saved.t:0;
  $('#castov').classList.remove('on');
  V.onloadedmetadata=()=>{ if(saved&&saved.t>15&&saved.t<V.duration-30)V.currentTime=saved.t;
    for(const tr of V.textTracks)tr.mode='hidden';
    const pa=store.get('mf_audio',null); const ai=v.audios.findIndex(x=>x.lang===pa); if(ai>0)setAudio(ai,true);
    const pref=store.get('mf_sub','off'); const i=[...V.textTracks].findIndex(x=>x.language===pref); setSub(pref==='off'?-1:i,true); };
  if(opts.adopt){   // la tele ya está reproduciendo este vídeo (p. ej. tras recargar la página): solo enlazar los controles
    CAST.loaded=true; CAST.lastT=CAST.player.currentTime;
    $('#castDev').textContent=CAST.ctx.getCurrentSession()?.getCastDevice().friendlyName||'la tele';
    $('#castov').style.backgroundImage=t.thumb?`url('${t.thumb}')`:''; $('#castov').classList.add('on');
    MINI=true; showMini(); return;
  }
  if(CAST&&CAST.ctx.getCurrentSession())castLoad();   // conectado a la tele (también si se conectó desde la portada)
  else V.play().catch(()=>{});
  wake();
}
function setSub(i,silent){
  subIdx=i; [...V.textTracks].forEach((tr,k)=>tr.mode=k===i?'showing':'hidden');
  if(casting()){const ms=CAST.ctx.getCurrentSession().getMediaSession();
    if(ms)ms.editTracksInfo(new chrome.cast.media.EditTracksInfoRequest(i>=0?[i+1]:[]),()=>{},()=>{})}
  if(!silent)store.set('mf_sub',i<0?'off':V.textTracks[i].language);
  buildMenu();
}
function buildMenu(){
  const m=$('#menu'); const tr=[...V.textTracks], au=cur?cur.v.audios:[];
  m.innerHTML=(au.length>1&&!casting()&&!airOn()?`<div class="h">Audio</div>`+au.map((x,i)=>`<div class="${audIdx===i?'sel':''}" data-a="${i}">${esc(x.label)}</div>`).join(''):'')
    +`<div class="h">Subtítulos</div><div class="${subIdx<0?'sel':''}" data-i="-1">Sin subtítulos</div>`+tr.map((x,i)=>`<div class="${subIdx===i?'sel':''}" data-i="${i}">${esc(x.label)}</div>`).join('');
  m.querySelectorAll('div[data-i]').forEach(d=>d.onclick=e=>{e.stopPropagation();setSub(+d.dataset.i);m.classList.remove('on')});
  m.querySelectorAll('div[data-a]').forEach(d=>d.onclick=e=>{e.stopPropagation();setAudio(+d.dataset.a);m.classList.remove('on')});
}
function closePlayer(){ hideUpNext(); saveProg(true); MINI=false; hideMini();
  if(casting()){CAST.loaded=false;const ms=CAST.ctx.getCurrentSession()?.getMediaSession();if(ms)ms.stop(new chrome.cast.media.StopRequest(),()=>{},()=>{})}
  $('#castov').classList.remove('on'); V.pause(); A.pause(); A.removeAttribute('src'); V.removeAttribute('src'); V.load(); P_.classList.remove('on'); document.body.style.overflow=''; if(document.fullscreenElement)document.exitFullscreen(); cur=null; render(); setTimeout(loadFeed,800); }
function saveProg(force,at){
  const d=curD(); if(!cur||!d||!ME)return;
  if(casting()&&at==null&&CAST.player.currentTime<1)return;   // la tele aún no ha dicho por dónde va: no pisar el progreso con 0
  const n=Date.now(); if(!force&&n-lastSave<10000)return; lastSave=n;
  const t=at??curT(), done=t>=d*0.8, old=PROG[cur.v.id];   // vista = pasado el 80 %
  const item={video_id:cur.v.id,t:Math.round(t),done,ts:Math.round(n/1000)};
  PROG[cur.v.id]={t:item.t,done:done||!!(old&&old.done),ts:item.ts};
  const body=JSON.stringify({profile:ME.id,...item});
  if(document.visibilityState==='hidden'&&navigator.sendBeacon)navigator.sendBeacon('api/progress.php',body);
  else fetch('api/progress.php',{method:'POST',body,keepalive:true}).catch(()=>{});
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1200)}
function wake(){P_.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(!V.paused&&!$('#menu').classList.contains('on'))P_.classList.add('idle')},3000)}
function nextEp(){const i=cur.t.videos.indexOf(cur.v);if(i<cur.t.videos.length-1){saveProg(true);startVideo(cur.t,cur.t.videos[i+1])}}
const toggle=()=>casting()?CAST.ctl.playOrPause():(V.paused?V.play():V.pause());
$('#pback').onclick=()=>casting()?minimizePlayer():closePlayer(); $('#pp').onclick=toggle; V.onclick=toggle;
$('#b10').onclick=()=>seekBy(-10); $('#f10').onclick=()=>seekBy(10); $('#next').onclick=nextEp;
$('#mute').onclick=()=>{if(casting())return CAST.ctl.muteOrUnmute();userMuted=!userMuted;applyVol();updMute()};
$('#vol').oninput=e=>{if(casting()){CAST.player.volumeLevel=+e.target.value;return CAST.ctl.setVolumeLevel()}
  V.volume=e.target.value;userMuted=false;applyVol();updMute()};
const updMute=()=>$('#mute').textContent=userMuted||V.volume===0?'🔇':'🔊';
$('#cc').onclick=e=>{e.stopPropagation();buildMenu();$('#menu').classList.toggle('on')};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():P_.requestFullscreen();
V.ondblclick=$('#fs').onclick;
P_.addEventListener('click',e=>{if(!e.target.closest('#cc,#menu'))$('#menu').classList.remove('on')});
V.onplay=()=>{P_.classList.remove('paused');$('#pp').textContent='⏸';wake();if(altAudio()){syncAudio(true);A.play().catch(()=>{})}};
V.onpause=()=>{P_.classList.add('paused');$('#pp').textContent='▶';P_.classList.remove('idle');saveProg(true);A.pause()};
V.onseeked=()=>syncAudio(true);
V.onratechange=()=>{A.playbackRate=V.playbackRate};
V.onwaiting=()=>{$('#spin').style.display='block';if(altAudio())A.pause()};
V.oncanplay=V.onplaying=()=>{$('#spin').style.display='none';if(altAudio()&&!V.paused){syncAudio(true);A.play().catch(()=>{})}};
V.onvolumechange=()=>{A.volume=V.volume;updMute()};
function onEnded(){ if(cur.t.type==='series'&&$('#next').style.display!=='none')nextEp(); else closePlayer(); }
V.onended=()=>{if(!casting())onEnded()};
// barra de progreso y tiempo: con el vídeo local o, si se está enviando, con la tele
function updateUI(){const d=curD()||0,t=curT(),p=d?t/d*100:0;
  $('#cur').style.width=p+'%';$('#dot').style.left=p+'%';$('#time').textContent=fmt(t)+' / '+fmt(d);
  skipState(); saveProg();
  if(!casting()&&V.buffered.length)$('#buf').style.width=(V.buffered.end(V.buffered.length-1)/d*100)+'%'}
V.ontimeupdate=()=>{if(casting())return; syncAudio(); updateUI()};
$('#seek').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seekTo((e.clientX-r.left)/r.width*curD())};
P_.onmousemove=wake; P_.ontouchstart=wake;
addEventListener('beforeunload',()=>saveProg(true));
addEventListener('keydown',e=>{
  if(!P_.classList.contains('on')||e.target.tagName==='INPUT')return; wake();
  const k=e.key;
  if(k===' '||k==='k'){e.preventDefault();toggle()}
  else if(k==='ArrowRight'){seekBy(10);toast('+10 s')} else if(k==='ArrowLeft'){seekBy(-10);toast('-10 s')}
  else if(k==='ArrowUp'){e.preventDefault();V.volume=Math.min(1,V.volume+.1);toast('Volumen '+Math.round(V.volume*100)+'%')}
  else if(k==='ArrowDown'){e.preventDefault();V.volume=Math.max(0,V.volume-.1);toast('Volumen '+Math.round(V.volume*100)+'%')}
  else if(k==='f')$('#fs').onclick(); else if(k==='m')$('#mute').onclick();
  else if(k==='a'&&cur.v.audios.length>1){const n=(audIdx+1)%cur.v.audios.length;setAudio(n);toast('Audio: '+cur.v.audios[n].label)}
  else if(k==='c'){const n=subIdx+1>=V.textTracks.length?-1:subIdx+1;setSub(n);toast(n<0?'Subtítulos: no':V.textTracks[n].label)}
  else if(k==='Escape'&&!document.fullscreenElement)closePlayer();
});
load();
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>

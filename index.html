<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FerFlix</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--red:#e50914;--bg:#141414;--fg:#fff;--muted:#b3b3b3}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:24px;padding:9px 4%;background:linear-gradient(#000c,#0000);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{color:var(--red);font-weight:900;font-size:25px;letter-spacing:1px;text-decoration:none}
nav a.l{color:#e5e5e5;text-decoration:none;font-size:14px;cursor:pointer}nav a.l.on{font-weight:700;color:#fff}
nav input{margin-left:auto;background:#000a;border:1px solid #fff6;color:#fff;padding:7px 12px;border-radius:3px;width:200px}
.hero{position:relative;height:50vh;min-height:330px;background:#222 center/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,#0000 60%),linear-gradient(0deg,var(--bg) 0,#0000 35%)}
.hero .in{position:absolute;z-index:2;left:4%;bottom:15%;max-width:620px}
.hero h1{font-size:clamp(28px,3.6vw,46px);margin-bottom:8px;text-shadow:2px 2px 8px #0008}
.hero p{font-size:clamp(14px,1.25vw,17px);line-height:1.4;text-shadow:1px 1px 4px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:12px;margin-top:12px}
.btn{padding:9px 24px;border-radius:4px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.btn.w{background:#fff;color:#000}.btn.w:hover{background:#ffffffbb}
.btn.g{background:#6d6d6eb3}.btn.g:hover{background:#6d6d6e66}
main{position:relative;z-index:3;margin-top:-5vh;padding-bottom:60px}
main.flat{margin-top:0;padding-top:70px}
.row{margin:0 0 28px;position:relative}
.row h2{font-size:20px;margin:0 4% 10px}
.track{display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;padding:30px 4%;margin:-30px 0;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:min(23vw,300px);aspect-ratio:16/9;border-radius:4px;background:#2a2a2a center/cover;position:relative;transition:transform .25s;cursor:pointer}
.card:hover{transform:scale(1.18);z-index:5;box-shadow:0 8px 24px #000a}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:14px;font-weight:700;background:linear-gradient(0deg,#000d,#0000);border-radius:0 0 4px 4px}
.card .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
/* cuadrícula de películas con pósters verticales (2:3) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px 12px;padding:6px 4% 10px}
.grid .card{width:auto;aspect-ratio:2/3;border-radius:6px}
.grid .card:hover{transform:scale(1.06)}
.grid .card .cap{border-radius:0 0 6px 6px}
.grid .card.hasposter .cap{opacity:0;transition:opacity .2s}   /* el póster ya lleva el título: se muestra al pasar el ratón */
.grid .card.hasposter:hover .cap{opacity:1}
/* quién ha visto la película entera: animalitos abajo a la izquierda del póster */
.wby{position:absolute;left:7px;bottom:9px;display:flex;z-index:2;transition:opacity .2s}
.wby span{width:24px;height:24px;border-radius:50%;background:#141414e6;border:1.5px solid #46d369;display:flex;align-items:center;justify-content:center;
  font-size:14px;margin-left:-7px;box-shadow:0 2px 6px #000a}
.wby span:first-child{margin-left:0}.wby .more{font-size:10px;font-weight:800;color:#46d369}
.wby span.part{border-color:#f5c542}   /* empezada (amarillo) frente a vista entera (verde) */
.grid .card:hover .wby{opacity:0}   /* al pasar el ratón deja sitio al título */
.grid .card:not(.hasposter) .wby{bottom:auto;top:8px}   /* sin póster el título va siempre abajo: los animalitos, arriba */
@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:12px 8px}}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.arrow{position:absolute;top:30px;bottom:30px;width:4%;z-index:6;background:#000a;font-size:30px;opacity:0;transition:opacity .2s}
.row:hover .arrow{opacity:1}.arrow.r{right:0}.arrow.lft{left:0}
.empty{text-align:center;padding:30vh 20px;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:#000b;display:none;overflow-y:auto}
.modal.on{display:block}
.box{background:#181818;width:min(860px,94vw);margin:4vh auto;border-radius:8px;overflow:hidden;position:relative}
.box .top{aspect-ratio:16/9;background:#222 center/cover;position:relative}
.box .top::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#181818 0,#0000 50%)}
.box .top .in{position:absolute;z-index:2;left:36px;bottom:30px}
.box .top h2{font-size:34px;margin-bottom:14px}
.x{position:absolute;top:14px;right:14px;z-index:3;width:36px;height:36px;border-radius:50%;background:#181818;font-size:20px}
.body{padding:0 36px 36px}
.meta{color:#46d369;font-weight:700;margin:8px 0}.meta span{color:var(--muted);font-weight:400;margin-left:10px}
.body p{line-height:1.5;color:#d2d2d2}
.eps h3{display:inline-block;margin:26px 0 12px}
.eps select{float:right;margin-top:24px;background:#242424;color:#fff;border:1px solid #fff4;padding:7px 10px;border-radius:4px}
.ep{display:flex;gap:16px;align-items:center;padding:16px;border-bottom:1px solid #333;cursor:pointer;border-radius:4px}
.ep:hover{background:#2a2a2a}.ep .n{font-size:22px;color:var(--muted);width:30px;text-align:center}
.ep .t{flex:1}.ep .t b{display:block;margin-bottom:4px}.ep .t small{color:var(--muted)}
.ep .p{height:3px;background:var(--red);margin-top:6px;border-radius:2px}
/* player */
#player{position:fixed;inset:0;z-index:100;background:#000;display:none;user-select:none}
#player.on{display:block}
#player video{width:100%;height:100%;background:#000}
#player video::cue{background:#000a;color:#fff;font-size:1.5em;font-family:Arial}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .3s;background:linear-gradient(#000a 0,#0000 18%,#0000 70%,#000c 100%)}
#player.idle .ui{opacity:0;cursor:none}
.ui .tp{display:flex;align-items:center;gap:18px;padding:22px 28px;font-size:20px}
.ui .tp .back{font-size:30px}
.ui .bt{padding:0 28px 22px}
.seek{width:100%;height:5px;background:#fff4;border-radius:3px;position:relative;cursor:pointer;margin-bottom:14px;transition:height .1s}
.seek:hover{height:8px}
.seek .buf,.seek .cur{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.seek .buf{background:#fff5}.seek .cur{background:var(--red)}
.seek .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--red);transform:translate(-50%,-50%)}
.ctl{display:flex;align-items:center;gap:20px}
.ctl button{font-size:26px;line-height:1;opacity:.9}.ctl button:hover{opacity:1;transform:scale(1.12)}
.ctl .sp{flex:1}.ctl .time{font-size:14px;color:#ddd;min-width:110px}
.vol{width:80px;accent-color:var(--red)}
.menu{position:absolute;right:28px;bottom:84px;background:#000e;border:1px solid #fff3;border-radius:6px;padding:8px 0;min-width:190px;display:none}
.menu.on{display:block}
.menu div{padding:9px 22px;cursor:pointer;font-size:15px}.menu div:hover{background:#fff2}.menu div.sel::before{content:"✓ ";color:var(--red)}
.menu div:not(.sel){padding-left:40px}
.menu div.h{padding:8px 22px 4px;font-size:12px;color:#999;text-transform:uppercase;cursor:default;letter-spacing:.5px}.menu div.h:hover{background:none}.menu div.h::before{content:""}
.spin{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border:4px solid #fff3;border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite;display:none}
@keyframes s{to{transform:rotate(360deg)}}
#gate{position:fixed;inset:0;z-index:200;background:radial-gradient(#2a0a0c,#000);display:none;align-items:center;justify-content:center;padding:20px}
#gate.on{display:flex}
#gate form{width:min(340px,100%);text-align:center}
#gate .logo{display:block;font-size:42px;margin-bottom:30px}
#gate input{width:100%;padding:14px;border-radius:4px;border:1px solid #555;background:#222;color:#fff;font-size:18px;text-align:center;letter-spacing:4px}
#gate button{width:100%;margin-top:14px;padding:13px;border-radius:4px;background:var(--red);font-weight:700;font-size:17px}
#gate button:disabled{opacity:.5}
#gate p{margin-top:16px;min-height:22px;color:#ff8080;font-size:14px}
/* perfiles */
#who{position:fixed;inset:0;z-index:190;background:radial-gradient(#2a0a0c,#000);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#who.on{display:flex}
#who .in{width:min(460px,100%);text-align:center}
#who h1{font-size:30px;margin:10px 0 6px}#who .sub{color:var(--muted);margin-bottom:22px}
#who .fld{position:relative}
#who input{width:100%;padding:14px;border-radius:4px;border:1px solid #555;background:#222;color:#fff;font-size:18px}
.sug{position:absolute;left:0;right:0;top:100%;background:#1c1c1c;border:1px solid #444;border-top:0;border-radius:0 0 6px 6px;text-align:left;z-index:2;display:none}
.sug.on{display:block}
.sug div{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:16px}
.sug div:hover,.sug div.act{background:#333}.sug span{font-size:26px}.sug small{margin-left:auto;color:var(--muted)}
.animals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0 4px}
.animals button{font-size:34px;padding:8px 0;border-radius:8px;background:#222;border:2px solid transparent;transition:transform .1s}
.animals button:hover{transform:scale(1.1)}.animals button.on{border-color:var(--red);background:#3a1215}
#who .go{width:100%;margin-top:18px;padding:13px;border-radius:4px;background:var(--red);font-weight:700;font-size:17px}
#who .go:disabled{opacity:.45;cursor:default}
#who .err{color:#ff8080;min-height:20px;margin-top:12px;font-size:14px}
.me{display:flex;align-items:center;gap:8px;cursor:pointer;position:relative;font-size:14px;white-space:nowrap}
.me .av{font-size:24px;width:34px;height:34px;border-radius:6px;background:#333;display:flex;align-items:center;justify-content:center}
.me .dd{position:absolute;right:0;top:44px;background:#000e;border:1px solid #fff3;border-radius:6px;padding:6px 0;display:none;min-width:170px}
.me .dd.on{display:block}.me .dd div{padding:9px 16px}.me .dd div:hover{background:#fff2}
.ep .done{color:#46d369;font-size:13px;margin-left:8px}
.ep .mk{width:34px;height:34px;border-radius:50%;border:2px solid #fff6;font-size:16px;flex:none}
.ep .mk.on{border-color:#46d369;color:#46d369}.ep .mk:hover{border-color:#fff}
.box .top .btns{margin-top:0}
/* tarjeta en proceso: gris que se va llenando de color de abajo arriba */
.card.proc{cursor:default;overflow:hidden}
.card.proc:hover{transform:none;box-shadow:none}
.card.proc .gray,.card.proc .fill{position:absolute;inset:0;background:inherit;border-radius:4px}
.card.proc .gray{filter:grayscale(1) brightness(.3)}
.card.proc .fill{clip-path:inset(calc(100% - var(--p)) 0 0 0);transition:clip-path 1.5s ease;filter:brightness(.8)}
.card.proc .line{position:absolute;left:0;right:0;height:2px;bottom:var(--p);background:var(--red);box-shadow:0 0 12px 2px var(--red);transition:bottom 1.5s ease}
.card.proc .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px 18px;text-shadow:0 1px 6px #000}
.card.proc .ov b{font-size:28px}.card.proc .ov small{font-size:12px;color:#e5e5e5;margin-top:2px}
.card.proc.nothumb{background:#1c1c1c}.card.proc.nothumb .gray{background:#1c1c1c;filter:none}
.card.proc.nothumb .fill{background:linear-gradient(0deg,#e50914,#5a070b)}
.card.proc.ready .fill{filter:none}.card.proc.ready .line{opacity:0;transition:opacity .6s 1.2s}
.card.proc.ready .ov b{color:#46d369}
/* cuadro de actividad de todos */
#app{position:relative}
/* Encima de la portada, a la derecha, y siempre por encima de donde empiezan las filas:
   las filas arrancan en (alto de la portada − 8vh), así que el cuadro termina 28px antes */
.feed{width:360px;display:flex;flex-direction:column;max-height:calc(100vh - 80px);
  background:linear-gradient(160deg,#1c1c1ce6,#0d0d0de6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid #ffffff1a;border-radius:14px;box-shadow:0 18px 40px #0009;overflow:hidden}
.feed .hd{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid #ffffff12;flex:none}
.feed .hd>span{font-size:22px;width:38px;height:38px;border-radius:10px;background:#e509141f;display:flex;align-items:center;justify-content:center}
.feed h3{font-size:15px;letter-spacing:.2px}.feed .hd small{color:var(--muted);font-size:12px}
.feed .list{overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:#444 transparent}
.feed .it{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;transition:background .15s}
.feed .it:hover{background:#ffffff12}
.feed .th{position:relative;flex:none;width:84px;aspect-ratio:16/9;border-radius:6px;background:#2a2a2a center/cover}
.feed .th .an{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;border-radius:50%;background:#181818;border:2px solid #181818;
  display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 6px #0008}
.feed .tx{min-width:0;flex:1;padding-left:4px}
.feed .who{display:flex;align-items:baseline;gap:8px;font-size:13px}
.feed .who time{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.feed .what{font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .person{border-radius:10px;margin-bottom:4px}
.feed .person.open{background:#ffffff08}
.feed .ph{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;user-select:none;transition:background .15s}
.feed .ph:hover{background:#ffffff12}
.feed .pav{flex:none;width:40px;height:40px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:24px}
.feed .pinfo{flex:1;min-width:0}.feed .pinfo b{font-size:14px}
.feed .pinfo small{display:block;color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .ph time{color:var(--muted);font-size:11px;white-space:nowrap}
.feed .chev{font-size:20px;color:#888;transition:transform .2s;line-height:1}
.feed .person.open .chev{transform:rotate(90deg);color:#fff}
.feed .pitems{padding:0 4px 6px 14px;border-left:2px solid #ffffff14;margin-left:28px}
.feed .pitems .it{padding:6px 6px}
.feed .pitems .th{width:72px}
.feed .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
.feed .tag.ok{background:#46d36922;color:#46d369}
.feed .tag.part{background:#f5c54222;color:#f5c542}
.feed .th .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--red);border-radius:0 0 0 6px}
.feed .fep{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .none{color:var(--muted);font-size:13px;padding:14px 10px 16px;text-align:center;line-height:1.5}
/* botón 👀 de la barra y su desplegable */
.fdrop{position:relative}
.fbtn{position:relative;width:38px;height:38px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.fbtn:hover,.fdrop.open .fbtn{background:#ffffff1f}
.livenow{display:none;align-items:center;gap:8px;cursor:pointer;padding:3px 10px 3px 4px;border-radius:20px;background:#ffffff12;transition:background .15s}
.livenow.on{display:flex}.livenow:hover{background:#ffffff24}
.livenow .avs{display:flex}
.livenow .lv{width:30px;height:30px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:18px;
  border:2px solid #46d369;margin-left:-8px;animation:ping 1.8s infinite}
.livenow .lv:first-child{margin-left:0}
.livenow .more{font-size:12px;color:#ddd;margin-left:4px}
.livenow small{font-size:12px;color:#46d369;font-weight:700;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.livenow small{display:none}}
.fpanel{position:absolute;right:-60px;top:44px;display:none;z-index:60}
.fdrop.open .fpanel{display:block;animation:fadeup .2s ease}
@media(max-width:700px){.fpanel{position:fixed;left:8px;right:8px;top:56px}.fpanel .feed{width:auto}}
/* ===== saltar intro / siguiente episodio / saltar créditos ===== */
.skipb{position:absolute;right:44px;bottom:118px;z-index:6;display:none;background:#000b;border:2px solid #ffffffb3;color:#fff;padding:12px 24px;border-radius:6px;font-weight:700;font-size:17px;backdrop-filter:blur(6px);transition:background .15s,color .15s}
.skipb.on{display:block;animation:fadeup .3s ease}.skipb:hover{background:#fff;color:#000}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
.upnext{position:absolute;right:44px;bottom:118px;z-index:7;display:none;gap:16px;align-items:center;width:min(540px,calc(100vw - 60px));padding:14px;border-radius:12px;
  background:#141414f2;border:1px solid #ffffff22;box-shadow:0 20px 50px #000c;backdrop-filter:blur(10px)}
.upnext.on{display:flex;animation:fadeup .35s ease}
.upnext .unth{flex:none;width:180px;aspect-ratio:16/9;border-radius:8px;background:#2a2a2a center/cover}
.upnext small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.upnext b{display:block;font-size:16px;margin:4px 0 12px;line-height:1.3}
.upnext .unbtns{display:flex;gap:8px;flex-wrap:wrap}.upnext .btn{padding:8px 16px;font-size:15px}
.upnext #unGo{position:relative;overflow:hidden}
.upnext #unGo::before{content:"";position:absolute;inset:0;background:#0000001f;transform-origin:left;animation:cd 10s linear forwards}
@keyframes cd{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#player.paused .upnext #unGo::before{animation-play-state:paused}
/* ===== colores del póster ===== */
.hero{--tint:20,20,20}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(var(--tint),.62) 0,rgba(var(--tint),.22) 42%,transparent 70%)}
.hero::after{z-index:1}
.grid .card:hover{box-shadow:0 14px 36px rgba(var(--glow,0,0,0),.7),0 0 0 2px rgba(var(--glow,255,255,255),.75)}
.box{--tint:24,24,24}
.box .top::after{background:linear-gradient(0deg,color-mix(in srgb,rgb(var(--tint)) 30%,#181818) 0,transparent 55%)}
.box .body{background:linear-gradient(180deg,color-mix(in srgb,rgb(var(--tint)) 30%,#181818) 0,#181818 340px)}
.box .meta{color:rgb(var(--tint))}.box .meta{filter:brightness(1.6) saturate(1.2)}
/* ===== intro FERFLIX ===== */
#intro{position:fixed;inset:0;z-index:400;background:#000;display:none;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:opacity .45s}
#intro.on{display:flex}#intro.out{opacity:0}
#intro::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle,#e509144d 0,transparent 55%);opacity:0;animation:iburst 1.4s 1.55s ease-out forwards}
#intro .iw{position:relative;display:flex;font-weight:900;font-size:clamp(56px,13vw,180px);letter-spacing:.02em;color:var(--red);animation:izoom 3s cubic-bezier(.7,0,.84,0) forwards}
#intro .iw span{display:inline-block;opacity:0;transform:scale(2.8) translateY(-8%);filter:blur(16px);text-shadow:0 0 28px #e50914b3,0 0 90px #e5091466;
  animation:iletter .6s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(.15s + var(--i) * .075s)}
#intro .iw::after{content:"";position:absolute;inset:-20% -40%;background:linear-gradient(100deg,transparent 42%,#ffffff8c 50%,transparent 58%);transform:translateX(-130%);animation:isweep 1s .85s ease-in-out forwards;mix-blend-mode:overlay}
#intro .skipi{position:absolute;bottom:26px;right:30px;color:#ffffff59;font-size:13px}
@keyframes iletter{to{opacity:1;transform:none;filter:none}}
@keyframes isweep{to{transform:translateX(130%)}}
@keyframes izoom{0%,63%{transform:scale(1);opacity:1}100%{transform:scale(10);opacity:0}}
@keyframes iburst{35%{opacity:1}100%{opacity:0}}
/* ===== avatares animados y "viendo ahora" ===== */

<script>

const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

async function setProfile(p){
  playIntro();   // la animación de FERFLIX, una vez al día por navegador
  ME=p; store.set('mf_profile',p.id);
  $('#who').classList.remove('on'); document.body.style.overflow='';

  PROG=await (await fetch('api/progress.php?profile='+p.id)).json();
  loadFeed(); pollProc();
  // pasa al perfil el progreso antiguo que había guardado en este navegador
  const old=store.get('mf_prog',null);
  if(old&&Object.keys(old).length){
    const items=Object.entries(old).filter(([id])=>!PROG[id]).map(([id,x])=>({video_id:+id,t:Math.round(x.t),ts:Math.round(x.ts/1000)}));
    if(items.length){await fetch('api/progress.php',{method:'POST',body:JSON.stringify({profile:p.id,items})});PROG=await (await fetch('api/progress.php?profile='+p.id)).json()}
    try{localStorage.removeItem('mf_prog')}catch{}
  }

}

/* ---------- intro de FERFLIX ---------- */
function playIntro(){
  const today=new Date().toDateString(); if(store.get('mf_intro_day','')===today)return; store.set('mf_intro_day',today);
  const el=$('#intro'); $('#iw').innerHTML=[...'FERFLIX'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');

// el "tu-dum": dos golpes graves con reverberación y un acorde suave (sintetizado, sin archivos de audio).
// Si el navegador no deja sonar audio sin un clic previo, la animación sale igual pero en silencio.
function tudum(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume();
    const out=ac.createGain(); out.gain.value=.6; out.connect(ac.destination);
    const rev=ac.createConvolver(), n=ac.sampleRate*2.4, ir=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
    rev.buffer=ir; const wet=ac.createGain(); wet.gain.value=.4; rev.connect(wet); wet.connect(out);
    const hit=(t0,f,dur,vol)=>{
      const o=ac.createOscillator(),g=ac.createGain(); o.type='sine';
      o.frequency.setValueAtTime(f*2.4,t0); o.frequency.exponentialRampToValueAtTime(f,t0+.07);
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
      o.connect(g); g.connect(out); g.connect(rev); o.start(t0); o.stop(t0+dur+.05);
      const nb=ac.createBuffer(1,ac.sampleRate*.09,ac.sampleRate), nd=nb.getChannelData(0);
      for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
      const ns=ac.createBufferSource(),lp=ac.createBiquadFilter(),ng=ac.createGain();
      lp.type='lowpass'; lp.frequency.value=800; ns.buffer=nb; ng.gain.value=vol*.45; ns.connect(lp); lp.connect(ng); ng.connect(out); ng.connect(rev); ns.start(t0);
    };
    const t=ac.currentTime+.18; hit(t,58,.45,1); hit(t+.4,49,1.7,1.15);
    [196,247,294,392].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+.45); g.gain.linearRampToValueAtTime(.045,t+1); g.gain.exponentialRampToValueAtTime(.001,t+2.8);
      o.connect(g); g.connect(out); g.connect(rev); o.start(t+.45); o.stop(t+2.9)});
    setTimeout(()=>ac.close(),4500);
  }catch{}
}
/* ---------- color dominante del póster ---------- */
const TINT=new Map();
function tintOf(url){
  if(!url)return Promise.resolve(null); if(TINT.has(url))return TINT.get(url);
  const pr=new Promise(res=>{const im=new Image(); im.onerror=()=>res(null);
    im.onload=()=>{try{
      const c=document.createElement('canvas'); c.width=c.height=28; const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(im,0,0,28,28); const d=x.getImageData(0,0,28,28).data;
      // agrupa los píxeles por tono (12 grupos) dando más peso a los colores vivos; gana el grupo más fuerte
      const bins=Array.from({length:12},()=>({w:0,r:0,g:0,b:0}));
      for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn;
        if(mx<40||df/mx<.22)continue;
        const h=mx===r?((g-b)/df+6)%6:mx===g?(b-r)/df+2:(r-g)/df+4, B=bins[Math.floor(h*2)%12], w=(df/mx)**2*(mx/255);
        B.w+=w;B.r+=r*w;B.g+=g*w;B.b+=b*w}
      const top=bins.reduce((a,b)=>b.w>a.w?b:a); if(top.w<.8)return res(null);
      const rgb=[top.r/top.w,top.g/top.w,top.b/top.w], k=Math.min(1.6,210/Math.max(...rgb));
      res(rgb.map(v=>Math.round(Math.min(255,v*k))).join(','));
    }catch{res(null)}};
    im.src=url});
  TINT.set(url,pr); return pr;
}
function applyTints(){
  const h=document.querySelector('.hero[data-hero]');
  if(h){const t=CAT.find(x=>x.id==h.dataset.hero);tintOf(t&&(t.poster||t.thumb)).then(c=>{if(c)h.style.setProperty('--tint',c)})}
  document.querySelectorAll('.grid .card[data-t]').forEach(el=>{const t=CAT.find(x=>x.id==el.dataset.t);
    tintOf(t&&(t.poster||t.thumb)).then(c=>{if(c)el.style.setProperty('--glow',c)})});
}

document.addEventListener('click',()=>$('#meDd').classList.remove('on'));
$('#switchP').onclick=e=>{e.stopPropagation();$('#meDd').classList.remove('on');ME=null;PROG={};try{localStorage.removeItem('mf_profile')}catch{};showWho()};
/* ---------- contraseña de acceso ---------- */
let lockT;
function lockMsg(s){clearInterval(lockT);const end=Date.now()+s*1000;
  const tick=()=>{const left=Math.ceil((end-Date.now())/1000);
    if(left<=0){clearInterval(lockT);$('#gmsg').textContent='';$('#gbtn').disabled=false;$('#gpw').disabled=false;return}
    const m=Math.floor(left/60),x=String(left%60).padStart(2,'0');
    $('#gmsg').textContent=`Demasiados intentos. Bloqueado: ${m}:${x}`;$('#gbtn').disabled=true;$('#gpw').disabled=true};
  tick();lockT=setInterval(tick,1000)}
async function showGate(){
  $('#gate').classList.add('on'); document.body.style.overflow='hidden';
  const j=await (await fetch('api/gate.php')).json(); if(j.locked)lockMsg(j.locked); else $('#gpw').focus();
}
$('#gform').onsubmit=async e=>{e.preventDefault();
  const r=await fetch('api/gate.php',{method:'POST',body:JSON.stringify({password:$('#gpw').value})}), j=await r.json();
  $('#gpw').value='';
  if(r.ok){document.body.style.overflow='';load();return}
  if(j.locked)lockMsg(j.locked); else $('#gmsg').textContent=`Contraseña incorrecta. Te queda ${j.left} intento.`;
};
/* ---------- actividad de todos y marcar como visto ---------- */
let FEED=[];
let FEED_SELF=false;   // este perfil solo ve su propia actividad
async function loadFeed(){
  if(!ME)return;
  try{const j=await (await fetch('api/activity.php?profile='+ME.id)).json();FEED=j.people||[];FEED_SELF=!!j.self_only}catch{FEED=[]}
  if(FEED_SELF&&ME)FEED_OPEN.add(ME.name);   // su propia lista, desplegada
  updateFeedUI();
}
// pinta el desplegable y el contador verde de quién está viendo algo ahora (sin contarte a ti)
// animalitos de quien ha visto cada película: aro verde = entera, amarillo = empezada
// (sale de "Lo que han visto": respeta a quien solo ve lo suyo)
function paintWatchers(){
  document.querySelectorAll('.grid .card[data-t] .wby').forEach(el=>{
    const id=+el.closest('[data-t]').dataset.t;
    const whole=FEED.filter(p=>p.items.some(i=>i.title_id===id&&i.done));
    const part=FEED.filter(p=>!whole.includes(p)&&p.items.some(i=>i.title_id===id&&!i.done));
    const all=[...whole.map(p=>({p,c:''})),...part.map(p=>({p,c:'part'}))];
    el.innerHTML=all.slice(0,5).map(x=>`<span class="${x.c}">${x.p.animal}</span>`).join('')+(all.length>5?`<span class="more">+${all.length-5}</span>`:'');
    el.title=[whole.length?'Vista entera: '+whole.map(p=>p.name).join(', '):'',part.length?'Empezada: '+part.map(p=>p.name).join(', '):''].filter(Boolean).join(' · ');
  });
}
function updateFeedUI(){
  paintWatchers();
  const live=FEED.filter(p=>p.watching&&(!ME||p.name!==ME.name)), ln=$('#liveNow');
  const what=w=>w.title+(w.type==='series'?` T${w.season??1}:E${w.episode??'?'}`:'');
  ln.classList.toggle('on',live.length>0);
  ln.title=live.map(p=>`${p.name} está viendo ${what(p.watching)}`).join('\n');
  ln.innerHTML=live.length?`<span class="avs">${live.slice(0,4).map(p=>`<span class="lv">${p.animal}</span>`).join('')}</span>`
    +(live.length>4?`<span class="more">+${live.length-4}</span>`:'')
    +`<small>${live.length===1?`${esc(live[0].name)} · ${esc(what(live[0].watching))}`:`${live.length} viendo ahora`}</small>`:'';
  const pn=$('#fpanel'), sc=pn.querySelector('.list')?.scrollTop||0;
  pn.innerHTML=feedHtml(); const l=pn.querySelector('.list'); if(l)l.scrollTop=sc;
}

addEventListener('keydown',e=>{if(e.key==='Escape')$('#fdrop').classList.remove('open')});

function ago(ts){const s=Math.max(0,Date.now()/1000-ts);
  return s<60?'ahora mismo':s<3600?`hace ${Math.floor(s/60)} min`:s<86400?`hace ${Math.floor(s/3600)} h`:s<172800?'ayer':`hace ${Math.floor(s/86400)} días`}
// personas desplegadas en el cuadro (se recuerda en este navegador)
const FEED_OPEN=new Set(store.get('mf_feed_open',[]));
const hm=s=>{const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h} h${m?' '+m+' min':''}`:`${m} min`};
function feedHtml(){
  const thumbOf=id=>{const t=CAT.find(x=>x.id===id);return t&&t.thumb?`background-image:url('${esc(t.thumb)}')`:''};
  const itemHtml=f=>`<div class="it" data-t="${f.title_id}">
      <div class="th" style="${thumbOf(f.title_id)}"><i class="pb" style="width:${f.done?100:(f.pct||0)}%;${f.done?'background:#46d369':''}"></i></div>
      <div class="tx"><div class="who">${f.done?'<span class="tag ok">✓ Entera</span>':`<span class="tag part">Un trozo${f.pct!=null?' · '+f.pct+'%':''}</span>`}
        <time>${ago(f.ts)}</time></div>
        <div class="what">${esc(f.title)}</div>
        ${f.type==='series'?`<div class="fep">T${f.season??1} · E${f.episode??'?'}${f.ep_name&&f.ep_name!==f.title?' · '+esc(f.ep_name):''}</div>`:'<div class="fep">Película</div>'}</div></div>`;
  const people=FEED.map(p=>{
    const open=FEED_OPEN.has(p.name), any=p.items.length;
    const sum=any?[p.whole?`${p.whole} entera${p.whole>1?'s':''}`:'',p.partial?`${p.partial} a medias`:'',hm(p.seconds)].filter(Boolean).join(' · '):'Nada todavía';
    return `<div class="person ${open?'open':''}">
      <div class="ph" data-person="${esc(p.name)}"><span class="pav ${p.watching?'live':''}" ${p.watching?'title="Viendo ahora"':''}>${p.animal}</span>
        <div class="pinfo"><b>${esc(p.name)}</b>${p.watching?`<small class="live">▶ Viendo ${esc(p.watching.title)}${p.watching.type==='series'?` · T${p.watching.season??1}:E${p.watching.episode??'?'}`:''}</small>`:''}<small>${sum}</small></div>
        ${any?`<time>${ago(p.last)}</time><span class="chev">›</span>`:''}</div>

async function pollProc(){

  // una subida que desaparece pasa a "procesando" (no está lista); un procesado que desaparece sí está listo
  const done=PROC.filter(o=>o.kind==='process'&&!has(list,o.key)), changed=PROC.some(o=>!has(list,o.key))||list.some(n=>!has(PROC,n.key));
  const thumbChanged=list.some(n=>{const o=PROC.find(x=>x.key===n.key);return o&&(o.thumb!==n.thumb||o.poster!==n.poster)});
  PROC=list;
  if(done.length){
    // termina: se llena al 100 % y luego aparece la tarjeta normal
    done.forEach(g=>{const el=document.querySelector(`[data-proc="${g.key}"]`);if(el){el.style.setProperty('--p','100%');el.classList.add('ready');el.querySelector('.ov').innerHTML='<b>✓ ¡Lista!</b>'}});
    setTimeout(async()=>{const r=await fetch('api/catalog.php');if(r.ok)CAT=await r.json();if(!P_.classList.contains('on'))render()},1800);
  } else if(changed||thumbChanged){ if(!P_.classList.contains('on'))render() }

    el.style.setProperty('--p',p.progress+'%');el.querySelector('.ov b').textContent=p.progress+'%';el.querySelector('.ov small').innerHTML=procSub(p)}
  clearTimeout(procT); procT=setTimeout(pollProc,PROC.length?6000:20000);
}

  const k=e.key;
  if(k===' '||k==='k'){e.preventDefault();toggle()}
  else if(k==='ArrowRight'){V.currentTime+=10;toast('+10 s')} else if(k==='ArrowLeft'){V.currentTime-=10;toast('-10 s')}
  else if(k==='ArrowUp'){e.preventDefault();V.volume=Math.min(1,V.volume+.1);toast('Volumen '+Math.round(V.volume*100)+'%')}
  else if(k==='ArrowDown'){e.preventDefault();V.volume=Math.max(0,V.volume-.1);toast('Volumen '+Math.round(V.volume*100)+'%')}
  else if(k==='f')$('#fs').onclick(); else if(k==='m')$('#mute').onclick();
  else if(k==='a'&&cur.v.audios.length>1){const n=(audIdx+1)%cur.v.audios.length;setAudio(n);toast('Audio: '+cur.v.audios[n].label)}
  else if(k==='c'){const n=subIdx+1>=V.textTracks.length?-1:subIdx+1;setSub(n);toast(n<0?'Subtítulos: no':V.textTracks[n].label)}
  else if(k==='Escape'&&!document.fullscreenElement)closePlayer();
});
load();
</script>
</body>
</html>
